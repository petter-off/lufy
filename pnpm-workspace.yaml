packages:
    - 'apps/*'
    - 'packages/*'

autoInstallPeers: true
engineStrict: true

allowedDeprecatedVersions:
    eslint: ^9.8.0

allowBuilds:
    '@parcel/watcher': true
    '@swc/core': true
    nx: true
    sharp: true
    unrs-resolver: true

catalogs:
    # Nx workspace tooling (@nx/* and nx share the same version)
    nx:
        '@nx/eslint': ^23.2.1
        '@nx/js': ^23.2.1
        '@nx/next': ^23.2.1
        '@nx/node': ^23.2.1
        nx: ^23.2.1

    # Compilation and runtime helpers (SWC, TypeScript, tslib)
    build:
        '@swc-node/register': ^1.12.1
        '@swc/core': ^1.16.2
        '@swc/helpers': ^0.5.23
        '@tailwindcss/postcss': ^4
        smol-toml: ^1.7.1
        tailwindcss: ^4
        tslib: ^2.3.0
        typescript: ~6.0.3

    # @types/* packages
    types:
        '@types/react': ^19
        '@types/react-dom': ^19
        '@types/node': ^26

    # Formatting and styling
    format:
        prettier: ^3.8.1

    # Linting
    lint:
        eslint: ^9.8.0
        eslint-config-next: 16.3.6

    runtime:
        next: 16.3.6
        react: 19.3.0
        react-dom: 19.3.0

overrides:
    smol-toml: catalog:build
